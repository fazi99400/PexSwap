[package]
name = "pexswap-amm"
version = "1.0.0"
edition = "2021"
description = "PexSwap constant-product AMM for the pexli-v2 Rust lane (SBF, proven in ZK)"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# `no-entrypoint` lets other Rust contracts import this as a CPI dependency
# without pulling in the program entrypoint symbol.
no-entrypoint = []
default = []

[dependencies]
# The pexli Rust-contract SDK (Solana-style SBF surface: accounts, CPI, PDAs).
# Rust and Solidity contracts settle in the same block against shared SMT state.
pexli-sdk = { version = "2.0", default-features = false }
borsh = "1.5"
thiserror = "1.0"

[dev-dependencies]
borsh = "1.5"
