name: Deploy Lifelox frontend to GitHub Pages

# Publishes frontend/ to GitHub Pages on every push to the working branch,
# or manually via the "Run workflow" button. No server / VPS involved.
on:
  push:
    branches:
      - claude/pexswap-dex-pexli-v2-31afl5
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Enables GitHub Pages automatically (build_type = workflow) so no manual
      # Settings -> Pages toggle is needed. Requires the repo to be public on a
      # free plan (private-repo Pages needs GitHub Pro/Team).
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Served from the apex custom domain lifelox.xyz (see frontend/public/CNAME),
          # so the base is "/". Without a custom domain, set this to /<repo>/ instead.
          VITE_BASE: /
          # These come from repo Settings -> Secrets and variables -> Actions -> Variables.
          # Fill them in after you deploy the contracts (see LAUNCH.md).
          VITE_PEXLI_CHAIN_ID: ${{ vars.VITE_PEXLI_CHAIN_ID }}
          VITE_PEXLI_RPC_URL: ${{ vars.VITE_PEXLI_RPC_URL }}
          VITE_PEXLI_EXPLORER: ${{ vars.VITE_PEXLI_EXPLORER }}
          VITE_LIFELOX_FACTORY: ${{ vars.VITE_LIFELOX_FACTORY }}
          VITE_LIFELOX_ROUTER: ${{ vars.VITE_LIFELOX_ROUTER }}
          # Optional: set it and the Positions list also shows cross-lane (Rust) pools.
          VITE_LIFELOX_DUAL_FACTORY: ${{ vars.VITE_LIFELOX_DUAL_FACTORY }}
          VITE_LIFELOX_DUAL_ROUTER: ${{ vars.VITE_LIFELOX_DUAL_ROUTER }}
          VITE_WPEX: ${{ vars.VITE_WPEX }}
          VITE_TOKEN_USDP: ${{ vars.VITE_TOKEN_USDP }}
          VITE_TOKEN_PXLI: ${{ vars.VITE_TOKEN_PXLI }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
